schema: spec-driven

context: |
  This repository provides SQ7MRU.Utils, a .NET 10 NuGet library, and
  SQ7MRU.Downloader, a separate Avalonia 12 MVVM desktop application.
  Artifacts are written in English; structural headings and SHALL/MUST remain English.
  Repository application and auxiliary tooling use C#/.NET. Do not add Python
  scripts, dependencies or workflow steps. Build commands belong in
  eng/SQ7MRU.Build with regression tests in the existing xUnit project.
  Public API documentation uses adjacent triple-slash XML source comments.
  Ship a library README and XML documentation for all three DLLs in NuGet;
  fail library builds on missing public comments and validate packaged docs.
  Official released specifications at https://www.adif.org/ are authoritative
  for ADIF. The reviewed protocol target is ADIF 3.1.8, not a product tag.
  Historical ADIF 1.0 is not the primary authority for current ADIF 3 behavior.
  Check field types, constraints, ADI/ADX eligibility, import-only rules and
  XML descriptions together against a pinned reviewed revision and fixtures.
  Never claim conformance by changing ADIF_VER alone. Separate application
  policies from format rules; full field coverage and ADX are not mandated.
  Before ADIF implementation, review or release preparation, check adif.org
  and its latest-release redirect for a newer released specification. Record
  the check date, official URL, released revision, supported revision and gaps.
  Review newer releases and extend support with tests; never silently bump
  a protocol version or claim latest support while implementation is pending.
  eQSL may use an older ADIF dialect. Keep provider compatibility profiles
  separate from the latest standard profile, backed by synthetic fixtures.
  Do not infer eQSL capabilities from the latest standard or force an upgrade
  on its import/upload paths without verified provider support.
  See docs/adif-conformance-review.md and the archived align-adif-standard change.
  AdifRow now covers 181 fields. ReadDocument/AdifWriter preserve document data;
  GetAdifRows is the backwards-compatible eQSL projection. ADX is unsupported.
  The strict profile is bounded and not an exhaustive external-registry,
  historical DXCC or geographic adjacency validator. Document these limits.
  openspec/specs documents the current implementation, not a proposed rewrite.
  Core contains contracts; Application coordinates bounded async download work;
  SQ7MRU.Utils provides service adapters, ADIF utilities, secure storage and DI.
  Services: eQSL, HRDLog/iQSL, EPC. DMC has been removed.
  EPC discovers the certificate accordion dynamically, stores image/PDF certificates
  and safely unpacks ZIP bundles directly into the group directory.
  One confined SQLite index records completed bundles; validated existing files
  and complete bundles are skipped. Counters represent logical selections.
  Legacy JSON bundle indexes migrate after certificate validation.
  TechnicalDirectoryName configures one shared directory for SQLite, its lock
  and refreshed ADIF exports; .sq7mru is only the default. The desktop reads
  SQ7MRU_TECHNICAL_DIRECTORY at startup. Require one portable directory name.
  Changing the name does not migrate previous data. Images keep account paths.
  Preserve cancellation, cookie isolation, bounded retries, sanitized errors,
  directory-relative/no-follow storage and eQSL rate limiting.
  No real credentials, cookies, account logs or downloaded cards belong in Git.
  Desktop and NuGet publication are handled by separate GitHub Actions workflows.
  Release versions come exclusively from GitHub tags; never hardcode a specific release tag in source or documentation.
  eQSL pacing starts at 1 second and grows by 500 ms per rate-limit response,
  shared across sessions for the provider lifetime; honor Retry-After.
  Desktop release RIDs: win-x86, win-x64, win-arm64, linux-x64, linux-arm64,
  linux-arm, osx-x64, osx-arm64. Six 64-bit targets use native runners;
  32-bit targets are cross-published with source tests on their 64-bit host.
  Desktop assets contain one self-contained executable with native libraries
  bundled for self-extraction. No installed .NET runtime is needed.
  Explicit-RID desktop publishes default to this mode in the project itself.
  Exclude library API XML and external PDB files from desktop output;
  keep the XML documentation in NuGet and fail on extra desktop publish files.
  Package desktop assets only in GitHub Actions: Windows ZIP, Linux TAR.GZ,
  macOS DMG with an app bundle, icon and Applications shortcut.
  Verify packaged bytes and permissions; mount DMGs read-only for verification.
  Aggregate SHA-256 hashes of final packages into SHA256SUMS, validating
  all eight platforms and a shared version before uploading release assets.
  macOS Developer ID signing and notarization are not configured.
  Linux x86 is excluded because the selected SDK has no application host.
  NuGet is one net10.0 AnyCPU package. Verify the same candidate package
  on all six native OS/CPU targets before publishing; test native SQLite too.
  v* tag pushes publish NuGet only. Published release events publish desktop
  assets for the same tag; tag pushes must not trigger duplicate desktop builds.
  Preserve existing release text; replace matching assets on rerun.
  Manual desktop runs upload artifacts only and use the SDK-evaluated version.
  Do not create local release archives or DMGs as part of development.

rules:
  specs:
    - Describe implemented behavior and identify known limitations explicitly.
    - Include WHEN/THEN scenarios and links to source and existing tests.
    - Use synthetic accounts and data in all examples.
  design:
    - Explain changes to authentication, storage boundaries, cancellation and retries.
    - For ADIF changes, cite the reviewed official revision and separate ADI, optional ADX, field coverage, format rules and application policy.
  tasks:
    - Keep changes small and validate each functional step with relevant tests.
