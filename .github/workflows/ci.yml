name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SQ7MRU.Utils.sln
      - run: dotnet build SQ7MRU.Utils.sln -c Release --no-restore
      - run: dotnet test SQ7MRU.Utils.sln -c Release --no-build --logger trx --results-directory artifacts/tests
      - run: dotnet pack SQ7MRU.Utils/SQ7MRU.Utils.csproj -c Release --no-build -o artifacts/nuget
      - name: Verify NuGet consumer
        shell: pwsh
        run: ./eng/verify-package.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.rid }}
          path: |
            artifacts/tests/**
            artifacts/nuget/*
          if-no-files-found: error
