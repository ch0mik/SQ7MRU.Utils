name: Publish desktop
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag' -or $env:EVENT_NAME -eq 'release') {
            if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') { throw 'Invalid release tag' }
            "value=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            $version = dotnet msbuild SQ7MRU.Downloader/SQ7MRU.Downloader.csproj -getProperty:Version
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read local build version' }
            "value=$($version.Trim())" >> $env:GITHUB_OUTPUT
          }
      - run: dotnet build SQ7MRU.Utils.sln -c Release
      - run: dotnet test SQ7MRU.Utils.sln -c Release --no-build
      - name: Publish desktop
        run: >-
          dotnet publish SQ7MRU.Downloader/SQ7MRU.Downloader.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -o artifacts/publish
      - name: Archive release files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "SQ7MRU.Downloader-$env:RELEASE_VERSION-$env:RELEASE_RID"
          if ($IsWindows) {
            $archive = "artifacts/$name.zip"
            Compress-Archive -Path artifacts/publish/* -DestinationPath $archive
          } else {
            $archive = "artifacts/$name.tar.gz"
            tar -czf $archive -C artifacts/publish .
            if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed' }
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error
  release:
    if: github.event_name != 'workflow_dispatch' && startsWith(github.event.release.tag_name || github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=()
            if [[ "${RELEASE_TAG#v}" == *-* ]]; then args+=(--prerelease); fi
            if ! gh release create "$RELEASE_TAG" --verify-tag --title "SQ7MRU ${RELEASE_TAG#v}" --generate-notes "${args[@]}"; then
              # Another actor may have created the release after our initial check.
              gh release view "$RELEASE_TAG" >/dev/null
            fi
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
