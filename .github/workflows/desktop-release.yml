name: Publish desktop
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x86
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
          - osx-x64
          - osx-arm64
        include:
          - os: windows-latest
            rid: win-x86
            # Tests run on the x64 host; publication targets 32-bit x86.
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04-arm
            rid: linux-arm
            # Tests run on the ARM64 host; publication targets 32-bit ARM.
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag' -or $env:EVENT_NAME -eq 'release') {
            if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') { throw 'Invalid release tag' }
            "value=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            $version = dotnet msbuild SQ7MRU.Downloader/SQ7MRU.Downloader.csproj -getProperty:Version
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read local build version' }
            "value=$($version.Trim())" >> $env:GITHUB_OUTPUT
          }
      - run: dotnet build SQ7MRU.Utils.sln -c Release
      - run: dotnet test SQ7MRU.Utils.sln -c Release --no-build
      - name: Publish desktop
        run: >-
          dotnet publish SQ7MRU.Downloader/SQ7MRU.Downloader.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=true -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded
          -o artifacts/publish
      - name: Verify single-file output
        shell: pwsh
        env:
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = if ($env:RELEASE_RID.StartsWith('win-')) { 'SQ7MRU.Downloader.exe' } else { 'SQ7MRU.Downloader' }
          $files = @(Get-ChildItem -LiteralPath artifacts/publish -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne $name) {
            throw "Expected one self-contained executable, found: $($files.Name -join ', ')"
          }
      - name: Package and verify desktop distribution
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          ./eng/package-desktop.ps1 -Rid $env:RELEASE_RID -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/packages/SQ7MRU.Downloader-*
          if-no-files-found: error
          overwrite: true
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify packages and generate SHA256SUMS
        run: dotnet run --project eng/SQ7MRU.Build/SQ7MRU.Build.csproj -c Release -- checksums artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-packages
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/SHA256SUMS
          if-no-files-found: error
          overwrite: true
      - name: Attach packages to GitHub Release
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.tar.gz artifacts/*.dmg artifacts/SHA256SUMS --clobber
